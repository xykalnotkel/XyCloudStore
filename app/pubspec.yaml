name: xycloud_order
description: "XyCloudStore - Sewa PC Cloud, Beli Akun Digital, dan Customer Service realtime."
publish_to: "none"
version: 3.8.0+26

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  onesignal_flutter: ^5.2.9
  image_picker: ^1.1.2
  flutter_web_auth_2: ^3.1.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  package_info_plus: ^8.1.1
  android_intent_plus: ^5.2.0
  cryptography: ^2.7.0
  crypto: ^3.0.6
  path_provider: ^2.1.5
  flutter_image_compress: ^2.3.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  record: 5.1.2
  audioplayers: ^5.2.1
  local_auth: ^2.3.0
  photo_manager: ^3.6.0
  camera: ^0.10.5+9
  video_player: ^2.8.6
  video_trimmer: ^5.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/brand/
    - assets/ilustrasi/
    - assets/ikon/
    - assets/bingkai/

# ---------------------------------------------------------------
#  Ikon launcher (adaptive icon Android)
#  jalankan: dart run flutter_launcher_icons
# ---------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# ---------------------------------------------------------------
#  Splash native (tampil sebelum Flutter engine siap)
#  jalankan: dart run flutter_native_splash:create
# ---------------------------------------------------------------
flutter_native_splash:
  color: "#2E1065"
  image: "assets/brand/splash_logo.png"
  android: true
  ios: false
  web: false
  android_gravity: center
  fullscreen: false
  android_12:
    color: "#2E1065"
    image: "assets/brand/icon_foreground.png"
    icon_background_color: "#FFFFFF"

dependency_overrides:
  # Set 'record' 5.1.2 yang koheren (era record_android 1.2.2 & interface 1.1.0).
  # Interface/platform terbaru (1.6.0/web 1.3/windows 1.0.7) menuntut startStream
  # yang belum diimplementasikan record_linux 0.7.2 → gagal di kernel_snapshot.
  record_android: 1.2.2
  record_platform_interface: 1.1.0
  record_web: 1.0.4
  record_windows: 1.0.2
  record_linux: 0.7.2
  record_darwin: 1.1.1
  # Batch I: local_auth_android ≥1.0.56 menuntut minSdk 24 sedangkan CI memakai
  # minSdk 23 (kebutuhan record_android). 1.0.47 (minSdk 19) teruji lokal.
  local_auth_android: 1.0.47
  # photo_manager 3.12.0 teruji lokal (compileSdk modul 36, Java 17).
  photo_manager: 3.12.0
