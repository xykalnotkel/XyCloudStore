name = "xycloud-api"
# account_id diambil dari variabel lingkungan CLOUDFLARE_ACCOUNT_ID saat deploy
main = "src/index.js"
workers_dev = true

# --- Domain khusus (custom domain) ---
routes = [
  { pattern = "api.xycloud.my.id", custom_domain = true },
  { pattern = "admin.xycloud.my.id", custom_domain = true },
  { pattern = "xycloud.my.id", custom_domain = true },
  { pattern = "www.xycloud.my.id", custom_domain = true },
]
compatibility_date = "2025-01-01"

# --- Database D1 ---
[[d1_databases]]
binding = "DB"
database_name = "xycloud"
database_id = "9d9df6d2-1521-4697-b08d-ea5be2b652b5"
# Supaya `wrangler d1 migrations apply xycloud --remote` tahu letak berkas
# migrasi dan mencatatnya di tabel d1_migrations. Sebelumnya migrasi dijalankan
# manual tanpa pencatatan, dan migrasi 0004 pernah terlewat tanpa ketahuan.
migrations_dir = "migrations"

# --- Durable Object untuk realtime (WebSocket) ---
[[durable_objects.bindings]]
name = "HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

# Dashboard admin & CS di-bundle sebagai modul teks
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[vars]
ALLOWED_ORIGINS = "https://xycloud.my.id,https://www.xycloud.my.id,https://admin.xycloud.my.id,https://api.xycloud.my.id,https://xycloud-dashboard.pages.dev,https://dashboard-iota-ten-70.vercel.app"
PUBLIC_URL = "https://api.xycloud.my.id"
WEB_URL = "https://xycloud.my.id"
REPO_RILIS = "xykalnotkel/XyCloudOrder"
MAIL_FROM = "XyCloudStore <noreply@xyc.my.id>"
ONESIGNAL_APP_ID = "f4843c35-cc1d-4772-9f70-1c4349397ffb"
CLOUDINARY_CLOUD = "jxjvz3qi"
WA_ADMIN = "6283116632566"
BANK_NAMA = "DANA"
BANK_NOMOR = "083116632566"
BANK_ATASNAMA = "XyCloudStore"
QRIS_URL = ""
MIN_TOPUP = "10000"
MAX_TOPUP = "10000000"
PAYMENT_PROVIDER = "pakasir"
EMAIL_ADMIN = "xycdigital@gmail.com"
BONUS_REFERRAL = "10000"
BONUS_DIUNDANG = "5000"
# Versi Graph dipin agar upgrade Meta disengaja dan dapat diaudit.
FACEBOOK_GRAPH_VERSION = "v26.0"
# OAuth Android: package id.xycloud.xycloud_order + SHA-1 sertifikat APK rilis.
# serverClientId Flutter tetap memakai OAuth client tipe Web (lihat docs/login-google.md).
GOOGLE_CLIENT_ID_ANDROID = "495336144977-1b3k66ngo4nhjf6kuetcl5j1vosfgbg4.apps.googleusercontent.com"
# Secret: JWT_SECRET, ADMIN_KEY, RESEND_API_KEY, ONESIGNAL_API_KEY,
#         CLOUDINARY_KEY, CLOUDINARY_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#         FACEBOOK_APP_ID, FACEBOOK_APP_SECRET,
#         PAKASIR_PROJECT, PAKASIR_API_KEY

# --- Pemeliharaan otomatis tiap jam ---
[triggers]
crons = ["0 * * * *"]
