<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XyCloudStore Console</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#7C3AED;--violet:#A78BFA;--cyan:#8B5CF6;--gold:#D9A441;--ok:#22C55E;--warn:#D9880F;--danger:#EF4444;
  --bg:#0E0720;--panel:#170D2E;--panel2:#1F1240;--line:#2C1B54;--ink:#EDE7FB;--muted:#9A8CBF;--r:14px}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;letter-spacing:-.01em;font-size:14px}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#3A2470;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- login ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 600px at 30% 20%,#2E1065,#0E0720);z-index:50;padding:20px}
.gatebox{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px}
.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#7C3AED,#5B16CC);
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 32px rgba(124,58,237,.45)}

/* ---------- layout ---------- */
.wrap{display:none;grid-template-columns:250px 1fr;min-height:100vh}
.wrap.on{display:grid}
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:5px}
aside .brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}
aside button{display:flex;align-items:center;gap:11px;width:100%;background:0;border:0;color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:600;padding:11px 13px;border-radius:11px;cursor:pointer;text-align:left;transition:.16s}
aside button:hover{background:var(--panel2);color:var(--ink)}
aside button.on{background:linear-gradient(135deg,rgba(124,58,237,.20),rgba(167,139,250,.12));color:#fff;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(124,58,237,.32)}
main{padding:26px 30px 60px;overflow-x:hidden}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.8px}
.top p{color:var(--muted);font-size:13px;margin-top:2px}
.sp{flex:1}

/* ---------- komponen ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat b{display:block;font-size:27px;font-weight:800;letter-spacing:-1px;margin-top:8px}
.stat span{color:var(--muted);font-size:12px;font-weight:600}
.ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.btn{border:0;border-radius:11px;padding:11px 17px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,#7C3AED,#5B16CC);color:#fff;display:inline-flex;align-items:center;gap:8px;
  transition:.16s;box-shadow:0 8px 18px rgba(124,58,237,.28)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:9px}
.btn.danger{background:rgba(239,68,68,.15);color:#A83C4A;border:1px solid rgba(239,68,68,.3);box-shadow:none}
.btn.ok{background:rgba(34,197,94,.15);color:#2D7357;border:1px solid rgba(34,197,94,.3);box-shadow:none}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  color:var(--ink);font-family:inherit;font-size:13.5px;outline:none;transition:.16s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.16)}
label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 7px 2px;letter-spacing:.2px}
.field{margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:0 12px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.018)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:800}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--panel2);border:1px solid var(--line);padding:14px 18px;
  border-radius:12px;font-size:13px;font-weight:600;opacity:0;transform:translateY(12px);transition:.3s;z-index:99;
  box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(4,7,14,.75);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;
  max-width:560px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* isi formulir panjang digulir di dalam kotak (penting di HP) */
.modal .box .grid,.modal .box .field{scroll-margin-bottom:14px}

/* ---------- chat ---------- */
.chatwrap{display:grid;grid-template-columns:290px 1fr;gap:14px;height:calc(100vh - 150px);min-height:460px}
.rooms{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-y:auto}
.room{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.room:hover{background:var(--panel2)}
.room.on{background:linear-gradient(90deg,rgba(124,58,237,.18),transparent);box-shadow:inset 3px 0 0 var(--primary)}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.chat .head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.chat .body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:72%;padding:11px 15px 8px;border-radius:16px;font-size:13.5px;line-height:1.5}
.msg.u{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.c{align-self:flex-end;background:linear-gradient(135deg,#7C3AED,#6025D9);border-bottom-right-radius:5px}
.msg.s{align-self:center;background:rgba(255,255,255,.05);color:var(--muted);font-size:11.5px;border-radius:20px;padding:7px 14px}
.msg time{display:block;font-size:9.5px;opacity:.6;margin-top:4px;text-align:right}
.chat .foot{padding:13px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* ---------- tombol menu untuk layar kecil ---------- */
.tombolMenu{display:none;position:fixed;left:14px;top:14px;z-index:60;width:44px;height:44px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);align-items:center;justify-content:center;cursor:pointer}
.tirai{display:none;position:fixed;inset:0;background:rgba(14,7,32,.62);backdrop-filter:blur(3px);z-index:55}
.tirai.on{display:block}

/* ---------- layar sedang: sidebar lebih ramping ---------- */
@media(max-width:1180px){
  .wrap{grid-template-columns:210px 1fr}
  main{padding:24px 20px 60px}
  aside button{font-size:13px;padding:10px 11px}
}

/* ---------- tablet dan ponsel: sidebar jadi laci ---------- */
@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .tombolMenu{display:flex}
  aside{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:56;height:100vh;overflow-y:auto;
    transform:translateX(-105%);transition:transform .26s ease;box-shadow:22px 0 50px rgba(0,0,0,.4)}
  aside.buka{transform:none}
  main{padding:70px 15px 70px}
  .top h1{font-size:20px}
  .top{gap:10px;margin-bottom:18px}
  .card{padding:15px;border-radius:15px}
  .g2,.g4{grid-template-columns:1fr}
  .grid[style*="1fr 1fr"]{grid-template-columns:1fr !important}
  .chatwrap{grid-template-columns:1fr;height:auto;gap:12px}
  .rooms{max-height:270px}
  .chat{min-height:60vh}
  .modal .box{max-width:100%;padding:20px;border-radius:20px;max-height:90vh}
  /* tabel lebar digulir mendatar, bukan memaksa halaman melar */
  .card table{min-width:640px}
  .card:has(table){overflow-x:auto}
  table{font-size:12.5px}
  th,td{padding:9px 10px;white-space:nowrap}
}

/* ---------- ponsel kecil ---------- */
@media(max-width:520px){
  main{padding:66px 12px 70px}
  .top h1{font-size:18px}
  .top p{font-size:12px}
  .btn{padding:10px 14px;font-size:12.5px}
  .btn.sm{padding:8px 12px;font-size:12px}
  .card{padding:13px}
  .field input,.field select,.field textarea{font-size:16px}
  aside{width:82vw;max-width:280px}
  .chat .foot{flex-wrap:wrap}
  .chat .foot input{min-width:0;flex:1}
}

/* v2.4 — tokens et comportements partages */
:root{--r:18px;--muted:#B3A6CA;--panel2:#25183E;--line:#392750}
button,input,select,textarea{font:inherit}button:disabled{opacity:.55;cursor:wait;filter:none;transform:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
main{min-width:0;max-width:1700px;width:100%;margin:0 auto}
aside{height:100dvh;min-height:0}aside .brand,aside>.sp,aside>button{flex-shrink:0}aside>.sp{display:none}
#menu{overflow-y:auto;min-height:0;flex:1;padding-right:3px}.nav-section{padding:18px 13px 7px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}
.top{gap:10px}.top h1{font-size:24px}.top p{line-height:1.6;max-width:650px}.card{padding:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.btn{min-height:42px;justify-content:center;border-radius:12px}.btn.sm{min-height:36px}
.muted{color:var(--muted)}.info-card{line-height:1.7;color:var(--muted);border-left:3px solid var(--violet)}
.modal{padding:18px;backdrop-filter:blur(5px)}.modal .box{max-height:calc(100dvh - 36px);padding:24px;border-radius:24px;scroll-padding-bottom:90px}
.modal h2{font-size:20px;line-height:1.4}.form-actions{display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:-24px;background:var(--panel);padding:16px 0;margin-top:16px;border-top:1px solid var(--line);z-index:2}.form-actions.static{position:static;padding:14px 0 0}
.form-actions .btn{min-width:92px}.form-error{color:#A83C4A;font-size:13px;line-height:1.6;margin-top:12px}.form-error:empty{display:none}
.advanced{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:14px}.advanced summary{cursor:pointer;color:var(--violet);font-weight:700}.advanced[open] summary{margin-bottom:18px}
.check-row{display:flex;align-items:center;gap:10px;font-size:13px}.check-row input{width:20px;height:20px}
.promo-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}.promo-card{padding:0;overflow:hidden}.promo-card-body{padding:18px}.promo-card-body p{margin-top:8px;font-size:12px;line-height:1.5}.promo-target{overflow-wrap:anywhere}
.promo-preview{height:214px;background:repeating-conic-gradient(var(--panel2) 0% 25%,var(--panel) 0% 50%) 50%/18px 18px;display:flex;align-items:center;justify-content:center;padding:12px}.promo-preview img{max-width:100%;max-height:100%;object-fit:contain}.form-preview{height:180px;border-radius:14px;margin:12px 0 20px}.form-preview:empty{display:none}
.upload-zone{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;padding:20px;border:1px dashed var(--violet);border-radius:14px;cursor:pointer;color:var(--ink)}.upload-zone small{color:var(--muted);font-size:11px}.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media(max-width:900px){.modal .box .grid{grid-template-columns:1fr 1fr!important}.top h1{font-size:22px}.modal .box{max-width:620px}.toast{left:16px;right:16px;bottom:18px}.form-actions .btn{flex:1}}
@media(max-width:440px){.modal{padding:10px}.modal .box{padding:18px;max-height:calc(100dvh - 20px)}.modal .box .grid{grid-template-columns:1fr!important}.form-actions{bottom:-18px}.top>.btn{flex:1}.card{padding:16px}.promo-card{padding:0}}

/* XyCloudStore Quiet Surface — no glow, no cyber decoration. */
:root{color-scheme:light;--primary:#7C3AED;--violet:#8B5CF6;--cyan:#A855F7;--gold:#D9A441;--ok:#16A34A;--warn:#D9880F;--danger:#DC2626;--bg:#F5F3FF;--panel:#FFFFFF;--panel2:#F3F0FF;--line:#E9E3F5;--ink:#1E1B2E;--muted:#7C738F;--r:18px}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.5;letter-spacing:0}
*{text-shadow:none!important}a{color:var(--primary)}
#gate{background:radial-gradient(900px 600px at 30% 20%,#2E1065,#100030);backdrop-filter:blur(6px)}.gatebox{border-radius:24px;background:rgba(255,255,255,.96);box-shadow:0 24px 60px rgba(16,0,48,.28),0 0 0 1px rgba(124,58,237,.12);padding:34px;backdrop-filter:blur(12px)}.logo{background:linear-gradient(135deg,#A78BFA,#7C3AED)!important;box-shadow:0 14px 32px rgba(124,58,237,.35)!important;border:0}
.wrap{grid-template-columns:242px minmax(0,1fr)}aside{background:#fff;border-right:1px solid var(--line);padding:24px 14px 16px;gap:4px}.brand{color:var(--ink)}aside button{color:var(--muted);padding:10px 12px;min-height:42px;font-size:13px;border-radius:9px}aside button:hover{background:#F4F5F8;color:var(--ink)}aside button.on{background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(139,92,246,.12));color:#5B21B6;box-shadow:inset 0 0 0 1px rgba(124,58,237,.22),0 8px 18px rgba(124,58,237,.14);font-weight:800}.nav-section{font-size:10px;letter-spacing:.09em;color:#8B949D;padding-top:22px}aside>button{color:var(--danger)!important}
#main{padding:32px 34px 64px;max-width:1560px}.top{gap:12px;margin-bottom:25px;align-items:center}.top h1{font-size:27px;font-weight:720;letter-spacing:-.65px;line-height:1.2;color:var(--ink)}.top p{font-size:13px;color:var(--muted);margin-top:7px;max-width:720px}.top>.btn{flex-shrink:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 14px 36px rgba(16,0,48,.06),0 0 0 1px rgba(124,58,237,.04);color:var(--ink)}.card h2{font-size:17px;letter-spacing:-.3px;margin-bottom:8px}.card h2+p{font-size:12.5px;line-height:1.6;margin-bottom:20px}.stat b{font-size:30px;font-weight:700;letter-spacing:-1px;color:var(--ink)}.stat span{font-size:12px;color:var(--muted)}.ico{background:linear-gradient(135deg,#F5F3FF,#EDE8FF)!important;color:#7C3AED!important;border-radius:12px;box-shadow:0 8px 18px rgba(124,58,237,.14)!important;border:1px solid rgba(124,58,237,.12)}
#main [style*="linear-gradient"]{box-shadow:0 12px 28px rgba(124,58,237,.22)!important}
.btn{min-height:42px;background:linear-gradient(180deg,#A78BFA,#7C3AED);box-shadow:0 10px 22px rgba(124,58,237,.28)!important;border:0;border-radius:12px;color:#fff;padding:10px 16px;font-weight:750;font-size:12.5px;transform:none;transition:transform .16s,box-shadow .16s}.btn:hover{background:linear-gradient(180deg,#B5A0FF,#6D28D9);box-shadow:0 14px 30px rgba(124,58,237,.36)!important;transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(16,0,48,.04)!important}.btn.ghost:hover{background:#F5F3FF;border-color:#C4B5FD;color:#5B21B6}.btn.danger{background:#FAECEE;border-color:#F2D7DC;color:#A83C4A}.btn.danger:hover{background:#F7E0E4}.btn.ok{background:#EAF4EE;color:#286548;border-color:#D3E6DA}.btn.sm{min-height:34px;padding:6px 11px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.dotlive{box-shadow:none;animation:none;background:var(--ok)}
input,textarea,select{color:var(--ink);background:#fff;border:1px solid #DCE2E8;border-radius:9px;font-size:14px;padding:11px 12px;box-shadow:none}input:focus,textarea:focus,select:focus{border-color:#8B5CF6;box-shadow:0 0 0 4px rgba(124,58,237,.14)}label{font-size:12px;letter-spacing:0;color:#64707C;font-weight:600}::placeholder{color:#A1A8B0}input[type=checkbox]{accent-color:var(--primary)}
.toolbar{display:flex;align-items:center;gap:16px;padding:0 0 20px}.toolbar input{max-width:390px}.toolbar .muted{margin-left:auto;white-space:nowrap;font-size:12px}.table-scroll{overflow-x:auto}table{font-size:13px;min-width:570px}th{font-size:10.5px;letter-spacing:.06em;font-weight:700;color:#83909B;background:#F8F9FB;padding:13px 16px;border-bottom:1px solid var(--line)}td{padding:16px;border-bottom:1px solid #EDF0F3;vertical-align:middle;color:var(--ink)}tr:hover td{background:#FAFBFC}td small, .person small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}.person{display:flex;gap:12px;align-items:center;min-width:220px}.person-avatar{width:39px;height:39px;flex:none;display:grid;place-items:center;background:#F0EDF6;color:#6254A8;border-radius:12px;font-weight:700;overflow:hidden}.person-avatar img{width:100%;height:100%;object-fit:cover}.person b{font-size:13px;font-weight:650}.status-pill{display:inline-flex;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:650;white-space:nowrap}.status-pill.good{color:#2B684C;background:#EAF4EE}.status-pill.bad{color:#A33E4D;background:#FAECEF}.status-pill.muted{color:#687785;background:#EEF1F4}.tag{box-shadow:0 2px 8px rgba(124,58,237,.10)!important}

const ic=(n,s=18,c='currentColor',w=1.9)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;
document.querySelector('aside button[onclick="keluar()"]').innerHTML=ic('logout')+'Keluar';

/* ---------- state ---------- */
let KEY=sessionStorage.getItem('xy_admin_key')||'';
let TAB='dash', ROOM=null, WS=null, DATA={};
let RENDER_ID=0;
const rp=n=>'Rp'+(n||0).toLocaleString('id-ID');
const dt=s=>s?new Date(s.includes('T')?s:s.replace(' ','T')+'Z').toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const jm=s=>s?new Date(s.includes('T')?s:s.replace(' ','T')+'Z').toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.setAttribute('role','status');e.classList.add('on');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
async function api(path,opt={}){
  const stamp=RENDER_ID;
  const r=await fetch('/api/admin'+path,{...opt,headers:{'Content-Type':'application/json','x-admin-key':KEY,...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if((!opt.method||opt.method==='GET')&&stamp!==RENDER_ID){const e=new Error('Navigasi berpindah');e.name='NavigationCancelled';throw e;}
  if(!r.ok)throw new Error(j.error||'Gagal');
  return j.data!==undefined?j.data:j;
}

/* ---------- auth ---------- */
async function masuk(){
  const k=document.getElementById('gk').value.trim();
  if(!k)return;
  try{
    const r=await fetch('/api/admin/stats',{headers:{'x-admin-key':k}});
    if(!r.ok)throw 0;
    KEY=k;sessionStorage.setItem('xy_admin_key',k);localStorage.removeItem('xy_admin_key');
    document.getElementById('gk').value='';
    document.getElementById('gate').style.display='none';
    document.getElementById('wrap').classList.add('on');
    TAB=tabDariHash();   // buka menu sesuai alamat (#/...), bukan selalu Dashboard
    konek();render();
  }catch(e){
    KEY='';sessionStorage.removeItem('xy_admin_key');document.getElementById('gk').value='';
    const el=document.getElementById('gerr');el.textContent='Admin key salah. Coba lagi.';el.style.display='block';
  }
}
function keluar(){sessionStorage.removeItem('xy_admin_key');localStorage.removeItem('xy_admin_key');location.reload()}

/* ---------- realtime inbox ---------- */
async function konek(){
  try{
    const auth=await api('/ws-ticket',{method:'POST',body:JSON.stringify({room:'cs:inbox'})});
    WS=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/cs:inbox?ticket='+encodeURIComponent(auth.ticket));
    WS.onmessage=e=>{
      let m;try{m=JSON.parse(e.data)}catch{return}
      if(m.type==='chat.message'){
        toast('Pesan baru dari '+(m.payload.room||'user'));
        if(TAB==='cs'){ if(ROOM===m.payload.room){DATA.msgs.push(m.payload);renderChat()} muatRooms() }
      }
    };
    WS.onclose=()=>setTimeout(konek,4000);
  }catch(e){setTimeout(konek,4000)}
}

/* ---------- menu ---------- */
const MENU=[['dash','dash','Dashboard'],['orders','cart','Order'],['plans','desktop','Paket PC'],
  ['produk','key','Produk Akun'],['banners','image','Banner Slider'],['promosi','image','Floating & Pop-up'],['stiker','star','Stiker & GIPHY'],['security','shield','Keamanan'],['perangkat','desktop','Perangkat'],['sampah','trash','Sampah Pengguna'],['media','image','Pusat Media'],['audit','chart','Audit & Kejadian'],['cs','chat','Inbox CS'],['statistik','chart','Statistik'],['moderasi','shield','Moderasi'],['galat','warn','Galat App'],['analitik','chart','Analitik'],['referral','tag','Referral'],['unit','desktop','Unit PC'],['forum','users','Komunitas'],['voucher','tag','Voucher'],['topup','wallet','Top Up'],['ulasan','star','Ulasan'],['users','users','Pengguna'],['alat','send','Email & Push'],['sistem','shield','Sistem'],['peran','users','Peran Admin']];
async function render(){
  const stamp=++RENDER_ID;
  const groups=[['Ringkasan',['dash','statistik','analitik']],['Transaksi & layanan',['orders','topup','plans','unit','produk','voucher']],['Konten & komunitas',['banners','promosi','stiker','forum','moderasi','ulasan']],['Pelanggan',['cs','users','referral']],['Keamanan & data',['security','perangkat','sampah','media','audit']],['Pengelolaan',['alat','galat','sistem','peran']]];
  document.getElementById('menu').innerHTML=groups.map(([nama,ids])=>`<div class="nav-section">${nama}</div>`+ids.map(id=>{const m=MENU.find(x=>x[0]===id);return m?`<button class="${TAB===id?'on':''}" aria-current="${TAB===id?'page':'false'}" onclick="ke('${id}')">${ic(m[1])}${m[2]}</button>`:''}).join('')).join('');
  document.getElementById('menu').querySelector('button.on')?.scrollIntoView({block:'nearest'});
  const lama=document.getElementById('main'),baru=document.createElement('main');baru.id='main';lama.replaceWith(baru);
  const nama=MENU.find(x=>x[0]===TAB)?.[2]||'Dashboard';
  baru.innerHTML=head(nama,'Memuat data terbaru…')+'<div class="card empty">Menghubungkan ke server…</div>';
  try{await ({dash:vDash,orders:vOrders,plans:vPlans,produk:vProduk,banners:vBanners,promosi:vPromosi,stiker:vStiker,security:vSecurity,perangkat:vDevices,sampah:vSampah,media:vMedia,audit:vAudit,cs:vCs,users:vUsers,alat:vAlat,topup:vTopup,ulasan:vUlasan,forum:vForum,unit:vUnit,statistik:vStatistik,sistem:vSistem,moderasi:vModerasi,voucher:vVoucher,peran:vPeran,galat:vGalat,analitik:vAnalitik,referral:vReferral}[TAB])();}
  catch(e){if(stamp!==RENDER_ID||e.name==='NavigationCancelled')return;baru.innerHTML=head(nama,'Data belum bisa dimuat')+`<div class="card empty"><p>${esc(e.message)}</p><button class="btn" style="margin-top:18px" onclick="render()">Coba lagi</button></div>`;}
}
function bukaTab(t){
  TAB=t;
  tutupModal();
  render();
  tutupLaci();          // di layar kecil, laci menutup sendiri setelah memilih menu
  window.scrollTo({top:0,behavior:'smooth'});

function ke(t){

/* ============ pilih banyak (multi-select) — tanpa cape ============
   Dipakai di Order, Top Up, Pengguna & Sampah. Pilih kotak per baris,
   atau kotak di kepala tabel untuk "pilih semua". Aksi massal muncul
   sebagai bilah saat ada yang tercentang. PILIH dikunci per cakupan
   (orders/topup/users) supaya berpindah menu tidak menumpuk. */
const PILIH={};
const scount=s=>Object.keys(PILIH[s]||{}).length;
const sids=s=>Object.keys(PILIH[s]||{}).filter(k=>PILIH[s][k]);
function selReset(s){delete PILIH[s];syncSel(s)}
function setSel(s,id,on){PILIH[s]=PILIH[s]||{};if(on)PILIH[s][id]=1;else delete PILIH[s][id];}
function setSelAll(s,ids,on){PILIH[s]=PILIH[s]||{};ids.forEach(id=>{if(on)PILIH[s][id]=1;else delete PILIH[s][id]});}
function cbSel(s,id){return `<input type="checkbox" class="cbOne" data-s="${s}" data-id="${id}"
  ${PILIH[s]&&PILIH[s][id]?'checked':''} onchange="setSel('${s}','${id}',this.checked);syncSel('${s}')">`;}
function cbSelHead(s,ids){const n=scount(s),t=ids.length;
  return `<input type="checkbox" class="cbAll" data-s="${s}" ${t&&n===t?'checked':''} ${t?'':'disabled'}
  onchange="setSelAll('${s}',[${ids.map(id=>`'${id}'`).join(',')}],this.checked);document.querySelectorAll('.cbOne[data-s="${s}"]').forEach(c=>c.checked=this.checked);syncSel('${s}')">`;}
function syncSel(s){
  const on=[];document.querySelectorAll(`.cbOne[data-s="${s}"]`).forEach(c=>{c.checked=!!(PILIH[s]&&PILIH[s][c.dataset.id]);if(c.checked)on.push(c.dataset.id)});
  const head=document.querySelector(`.cbAll[data-s="${s}"]`);const tot=document.querySelectorAll(`.cbOne[data-s="${s}"]`).length;
  if(head)head.checked=tot>0&&on.length===tot;
  document.querySelectorAll(`.cbOne[data-s="${s}"]`).forEach(c=>{const tr=c.closest('tr');if(tr)tr.classList.toggle('srow',c.checked)});
  const bar=document.getElementById('bar-'+s);const hitung=document.getElementById('bar-'+s+'-n');
  if(bar)bar.style.display=on.length?'flex':'none';
  if(hitung)hitung.textContent=on.length;
  const hapusBar=document.getElementById('bar-'+s+'-hapus');
  if(hapusBar)hapusBar.style.display=on.length?'flex':'none';
  const kosong=document.getElementById('kosong-'+s);
  if(kosong)kosong.style.display=on.length?'none':'flex';
}
function warnaBar(n){return n>1?'baris '+n+' pesanan':'baris '+n+' pesanan';}

async function ubahStatusMassal(status){
  const ids=sids('orders');if(!ids.length)return;
  const label=status==='selesai'?'menyelesaikan':'membatalkan';
  if(!await xkonfirmasi(`${label==='menyelesaikan'?'Selesaikan':'Batalkan'} ${ids.length} pesanan?`,
    `Akan diteruskan ke agen untuk ${ids.length} order terpilih. Host dibersihkan dan pengembalian hanya berlaku sebelum unit siap.`,
    {tombol:status==='selesai'?'Selesaikan semua':'Batalkan semua',bahaya:true}))return;
  let ok=0,ganggu=[];
  for(const id of ids){
    try{await api('/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});ok++}
    catch(e){ganggu.push((DATA.orders.find(o=>o.id===id)||{}).kode||id)}
  }
  toast(`${ok} diperbarui${ganggu.length?' · '+ganggu.length+' gagal':''}`);
  delete PILIH['orders'];vOrders();
}
async function ubahStatus(id,status){
  if(!['batal','selesai'].includes(status)){toast('Status siap/aktif diperbarui otomatis oleh agen, bukan dibuat manual.');vOrders();return;}
  if(!await xkonfirmasi('Akhiri atau batalkan pesanan?','Host akan dibersihkan. Pengembalian otomatis hanya berlaku sebelum unit siap.',{tombol:'Lanjutkan',bahaya:true})){vOrders();return;}
  try{await api('/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('Permintaan diteruskan ke agen.');vOrders();}catch(e){toast(e.message);vOrders();}
}

/* Baca berkas gambar jadi data URI lalu tampilkan pratinjaunya. */
function pilihGambarProduk(ev){
  const f=ev.target.files[0]; if(!f) return;
  if(f.size>5*1024*1024){ toast('Ukuran gambar maksimal 5 MB'); return }
  const r=new FileReader();
  r.onload=()=>{
    document.getElementById('f_gambar').value=r.result;
    document.getElementById('pratinjauGambar').innerHTML=
      `<img src="${esc(mediaUrl(r.result))}" style="width:100%;height:100%;object-fit:cover">`;

      <button class="btn" onclick="balas()">${ic('send',16)}Kirim</button></div>`;
  const b=document.getElementById('cbody');b.scrollTop=b.scrollHeight;

let _tt;
function ketik(){clearTimeout(_tt);api('/cs/typing',{method:'POST',body:JSON.stringify({room:ROOM,typing:true})}).catch(()=>{});
  _tt=setTimeout(()=>api('/cs/typing',{method:'POST',body:JSON.stringify({room:ROOM,typing:false})}).catch(()=>{}),2200)}
async function kirimGambarCs(ev){
  const f=ev.target.files[0]; if(!f) return;
  if(f.size>5*1024*1024){ toast('Ukuran gambar maksimal 5 MB'); return }
  toast('Mengunggah gambar...');
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const up=await api('/upload',{method:'POST',body:JSON.stringify({file:r.result,folder:'xycloudstore/chat'})});
      const m=await api('/cs/reply',{method:'POST',body:JSON.stringify({room:ROOM,teks:'',gambar:up.url})});
      DATA.msgs.push(m); renderChat(); muatRooms(); toast('Gambar terkirim');
    }catch(e){ toast(e.message) }
  };
  r.readAsDataURL(f);
  ev.target.value='';
}

async function balas(){
  const i=document.getElementById('cinp');const t=i.value.trim();if(!t)return;i.value='';
  const m=await api('/cs/reply',{method:'POST',body:JSON.stringify({room:ROOM,teks:t})});
  DATA.msgs.push(m);renderChat();muatRooms();
}

}

async function unduhCadangan(id){
  const r=await fetch('/api/admin/cadangan/'+encodeURIComponent(id),{headers:{'x-admin-key':KEY}});
  if(!r.ok)throw new Error('Cadangan gagal diunduh');
  const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='xycloudstore-'+id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function tandaiSensitif(jenis,refId,nilai,idLaporan){
  const tabel = jenis==='ulasan' ? 'ulasan' : 'forum';
  await api('/konten/'+tabel+'/'+refId,{method:'PATCH',body:JSON.stringify({sensitif:Boolean(nilai)})});
  await api('/laporan/'+idLaporan,{method:'PATCH',body:JSON.stringify({status:'selesai'})});
  toast(nilai?'Konten ditandai sensitif':'Konten ditandai aman'); vModerasi();
}

async function hapusKonten(jenis,refId,idLaporan){
  if(!await xkonfirmasi('Hapus konten ini?','Konten dan balasannya akan hilang permanen.',
    {tombol:'Hapus',bahaya:true})) return;
  try{
    if(jenis==='balasan') await api('/forum/balasan/'+refId,{method:'DELETE'});
    else await api('/forum/'+refId,{method:'DELETE'});
  }catch(e){ toast(e.message) }
  await api('/laporan/'+idLaporan,{method:'PATCH',body:JSON.stringify({status:'selesai'})});
  toast('Konten dihapus'); vModerasi();
}

async function selesaikanLaporan(id){
  await api('/laporan/'+id,{method:'PATCH',body:JSON.stringify({status:'selesai'})});
  toast('Laporan ditutup'); vModerasi();
}

/* ---------- statistik ---------- */
function batang(data, kunciNilai, warna){
  const maks = Math.max(1, ...data.map(d => Number(d[kunciNilai]||0)));
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:16px">
    ${data.map(d => `<div title="${esc(d.d)}: ${d[kunciNilai]}" style="flex:1;display:flex;flex-direction:column;
      justify-content:flex-end;height:100%">
      <div style="height:${Math.max(3,(Number(d[kunciNilai]||0)/maks)*100)}%;background:${warna};
        border-radius:6px 6px 3px 3px;transition:.3s"></div></div>`).join('')}
  </div>
  <div class="row" style="justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--muted)">
    <span>${esc((data[0]||{}).d||'')}</span><span>${esc((data[data.length-1]||{}).d||'')}</span></div>`;
}

function cakupanPemeliharaan(){ return (document.querySelector('input[name="pm_cakupan"]:checked')||{}).value||'semua'; }
const KET_CAKUPAN={
  'semua':'Menonaktifkan situs web dan aplikasi Android. Pakai untuk perawatan menyeluruh.',
  'web':'Hanya situs publik (xycloud.my.id) yang ditutup dan menampilkan halaman perawatan. Aplikasi Android tetap berjalan normal.',
  'aplikasi':'Hanya aplikasi Android yang diblokir (melihat halaman perawatan). Situs web tetap berjalan normal.'
};
function ketCakupan(v){ const el=document.getElementById('keteranganCakupan'); if(el) el.textContent=KET_CAKUPAN[v]||''; }
async function ubahPemeliharaan(aktif){
  const ck=cakupanPemeliharaan();
  if(aktif && !await xkonfirmasi('Nyalakan mode pemeliharaan?',
    'Ini akan menonaktifkan: '+KET_CAKUPAN[ck]+'\n\nDashboard admin dan agen PC tetap bisa dipakai sampai kamu mematikannya lagi.',
    {tombol:'Nyalakan',bahaya:true})) return;
  await api('/sistem/pemeliharaan',{method:'POST',body:JSON.stringify({aktif:Boolean(aktif),cakupan:ck})});
  toast(aktif?('Mode pemeliharaan menyala ('+ck+')'):'Layanan kembali normal'); vSistem();
}
async function simpanPesanPemeliharaan(){
  const pesan=document.getElementById('f_pesanPemeliharaan').value;
  const ck=cakupanPemeliharaan();
  await api('/sistem/pemeliharaan',{method:'POST',body:JSON.stringify({aktif:false,cakupan:ck,pesan})});
  toast('Pesan & cakupan pemeliharaan disimpan'); vSistem();
}
function inisialisasiCakupan(){ ketCakupan(cakupanPemeliharaan()); }
async function jalankanPemeliharaan(){
  const el=document.getElementById('hasilSistem'); el.textContent='Menjalankan...';
  const d=await api('/sistem/bersihkan',{method:'POST'});
  el.textContent=`Selesai: OTP ${d.otpDibersihkan}, batas ${d.batasDibersihkan}, sesi ${d.sesiDitutup}, unit ${d.unitOffline}, top up ${d.topupKedaluwarsa}`;
  toast('Pemeliharaan selesai');
}
async function kosongkanCache(){
  const el=document.getElementById('hasilSistem'); el.textContent='Mengosongkan singgahan...';
  const d=await api('/sistem/cache',{method:'DELETE'});
  el.textContent='Singgahan dikosongkan: '+((d.dibuang||[]).join(', ')||'tidak ada yang tersimpan');
  toast('Singgahan dikosongkan');
}

async function prosesTopupMassal(status){
  const ids=sids('topup');if(!ids.length)return;
  const setuju=status==='disetujui';
  if(!await xkonfirmasi(`${setuju?'Setujui':'Tolak'} ${ids.length} permintaan top up?`,
    setuju?'Saldo akan ditambahkan ke semua akun terpilih.':'Pastikan sudah meninjau bukti transfer tiap baris.',{tombol:setuju?'Setujui semua':'Tolak semua',bahaya:!setuju}))return;
  let ok=0,lewati=0;
  for(const id of ids){
    const t=(DATA.topup||[]).find(x=>x.id===id);
    if(t && ((setuju&&t.status==='disetujui')||(!setuju&&t.status==='ditolak'))){lewati++;continue}
    try{await api('/topup/'+id,{method:'PATCH',body:JSON.stringify({status})});ok++}
    catch(e){lewati++}
  }
  toast(ok+' diproses'+(lewati?' · '+lewati+' dilewati':''));
  delete PILIH['topup'];vTopup();
}
async function prosesTopup(id,status){
  let catatan=null;
  if(status==='ditolak'){ catatan=await xtanya('Tolak permintaan','Alasan penolakan','Bukti transfer tidak cocok'); if(catatan===null) return }
  await api('/topup/'+id,{method:'PATCH',body:JSON.stringify({status,catatan})});
  toast(status==='disetujui'?'Saldo sudah ditambahkan':'Permintaan ditolak');
  vTopup();
}

/* Dialog khas XyCloudStore, menggantikan alert/confirm/prompt bawaan peramban. */
function xdialog({judul,isi,tombol='Lanjutkan',batal='Batal',bahaya=false,input=null,nilai=''}){
  return new Promise(resolve=>{
    const bungkus=document.createElement('div');
    bungkus.className='modal on';
    bungkus.innerHTML=`<div class="box" style="max-width:440px">
      <h3>${esc(judul)}</h3>
      ${isi?`<p style="color:var(--muted);font-size:13.5px;line-height:1.65;margin:0 0 16px">${isi}</p>`:''}
      ${input!==null?`<div class="field"><label>${esc(input)}</label>
        <input id="xdlgInput" value="${esc(nilai)}" autofocus></div>`:''}
      <div class="row" style="justify-content:flex-end;gap:10px;margin-top:18px">
        <button class="btn ghost" id="xdlgNo">${esc(batal)}</button>
        <button class="btn ${bahaya?'danger':''}" id="xdlgYes">${esc(tombol)}</button>
      </div></div>`;
    document.body.appendChild(bungkus);

    const tutup=(hasil)=>{ bungkus.remove(); resolve(hasil) };
    bungkus.querySelector('#xdlgNo').onclick=()=>tutup(input!==null?null:false);
    bungkus.querySelector('#xdlgYes').onclick=()=>{
      const el=bungkus.querySelector('#xdlgInput');
      tutup(input!==null?(el?el.value:''):true);
    };
    bungkus.onclick=(e)=>{ if(e.target===bungkus) tutup(input!==null?null:false) };
    const f=bungkus.querySelector('#xdlgInput'); if(f){ f.focus(); f.select();
      f.onkeydown=(e)=>{ if(e.key==='Enter') bungkus.querySelector('#xdlgYes').click() } }
  });
}
const xkonfirmasi=(judul,isi,opsi={})=>xdialog({judul,isi,...opsi});
const xtanya=(judul,label,nilai='')=>xdialog({judul,input:label,nilai,tombol:'Simpan'});

  if(v===null||v===undefined) return '';

const MEDIA_INFO=/*__XY_MEDIA__*/ {"cloud":"","base":""};
function mediaUrl(value,size='t'){
 try{const u=new URL(value,location.origin);let path;
  if(u.pathname.startsWith('/img/')&&u.hostname.endsWith('xycloud.my.id')){path=u.pathname.replace(/^\/img\/[^/]+\//,'');}
  else if(u.hostname==='res.cloudinary.com'&&(!MEDIA_INFO.cloud||u.pathname.startsWith('/'+MEDIA_INFO.cloud+'/'))){const cut=u.pathname.indexOf('/image/upload/');if(cut<0)return value;const all=u.pathname.slice(cut+14);const folder=all.indexOf('xycloudstore/');if(folder<0)return value;const version=all.slice(0,folder).split('/').find(p=>/^v\d+$/.test(p));path=(version?version+'/':'')+all.slice(folder);}
  else return value;
  return (MEDIA_INFO.base||'https://api.xycloud.my.id')+'/img/'+size+'/'+path+'?v=26';
 }catch{return value;}
}

       <button class="btn sm ghost" onclick="blokirUserMassal(false)">Buka blokir</button>`}
   <button class="btn sm ghost" onclick="kosongPilihan('${sc}')">Bersihkan</button></div>`;
 document.getElementById('main').innerHTML=head(trash?'Sampah Pengguna':'Pengguna',trash?'Pulihkan akun atau hapus permanen setelah peninjauan':'Status akun, akses, dan data pelanggan',`<button class="btn ghost" onclick="ke('${trash?'users':'sampah'}')">${trash?'Kembali ke pengguna':'Buka sampah'}</button>`)+
 `<div class="card">${bar}<div class="toolbar"><input id="user_search" placeholder="Cari nama atau email…" oninput="filterUsers(${trash})"><span class="muted">${d.length} akun</span></div><div class="table-scroll"><table><thead><tr><th class="ktkhead">${cbSelHead(sc,ids)}</th><th>Pengguna</th><th>Status</th><th>Tier</th><th>Saldo</th><th></th></tr></thead><tbody id="user_rows">${d.map(u=>userRow(u,trash)).join('')||`<tr><td colspan="6" class="empty">Belum ada akun di daftar ini.</td></tr>`}</tbody></table></div></div>`;
 syncSel(sc);
}
const vSampah=()=>vUsers(true);
function filterUsers(trash){const sc=trash?'sampah':'users';const q=document.getElementById('user_search').value.toLowerCase();document.getElementById('user_rows').innerHTML=DATA.users.filter(u=>(u.nama+' '+u.email).toLowerCase().includes(q)).map(u=>userRow(u,trash)).join('');syncSel(sc);}
async function trashUserMassal(){const ids=sids('users').filter(id=>!((DATA.users.find(u=>u.id===id)||{}).owner_protected));if(!ids.length){toast('Tidak ada akun non-pemilik yang terpilih.');return}if(!await xkonfirmasi('Pindahkan '+ids.length+' akun ke Sampah?','Akun tidak bisa masuk sampai dipulihkan. Bukan penghapusan permanen. Akun pemilik dilindungi dan dilewati.',{tombol:'Pindahkan',bahaya:true}))return;let ok=0;for(const id of ids){try{await api('/users/'+id+'/trash',{method:'POST',body:JSON.stringify({konfirmasi:'HAPUS'})});ok++}catch(e){}}toast(ok+' akun dipindahkan');delete PILIH['users'];vUsers();}
async function blokirUserMassal(blokir){const ids=sids('users').filter(id=>{const u=DATA.users.find(x=>x.id===id);return u&&!u.owner_protected&&!!u.diblokir!==blokir});if(!ids.length){toast('Tidak ada akun yang cocok untuk diubah.');return}if(!await xkonfirmasi((blokir?'Blokir ':'Buka blokir ')+ids.length+' akun?','Akun pemilik dilindungi dan dilewati.',{tombol:blokir?'Blokir':'Buka blokir',bahaya:blokir}))return;let ok=0;for(const id of ids){try{await api('/users/'+id+'/block',{method:'POST',body:JSON.stringify({blocked:blokir})});ok++}catch(e){}}toast(ok+' akun diperbarui');delete PILIH['users'];vUsers();}
async function restoreUserMassal(){const ids=sids('sampah');if(!ids.length)return;if(!await xkonfirmasi('Pulihkan '+ids.length+' akun?','Akun bisa masuk kembali setelah login ulang.',{tombol:'Pulihkan'}))return;let ok=0;for(const id of ids){try{await api('/users/'+id+'/restore',{method:'POST',body:'{}'});ok++}catch(e){}}toast(ok+' akun dipulihkan');delete PILIH['sampah'];vSampah();}
async function permanentUserMassal(){const ids=sids('sampah').filter(id=>!((DATA.users.find(u=>u.id===id)||{}).owner_protected));if(!ids.length){toast('Tidak ada akun non-pemilik di pilihan.');return}const kunci=await xtanya('Hapus permanen massal','Ketik HAPUS untuk menghapus permanen '+ids.length+' akun (tidak bisa dibatalkan) dan seluruh datanya.','');if(kunci!=='HAPUS'){toast('Dibatalkan.');return}const yes=await xkonfirmasi('Tindakan permanen','Yakin hapus permanen '+ids.length+' akun? Seluruh data akan hilang.',{tombol:'Hapus permanen',bahaya:true});if(!yes)return;let ok=0;for(const id of ids){try{await api('/users/'+id+'/permanent',{method:'DELETE',body:JSON.stringify({konfirmasi:'HAPUS PERMANEN'})});ok++}catch(e){}}toast(ok+' akun dihapus permanen');delete PILIH['sampah'];vSampah();}
function kelolaUser(id){const u=DATA.users.find(x=>x.id===id);if(!u)return;
 modal(`<div class="dialog-eyebrow">PENGELOLAAN AKUN</div><h2>${esc(u.nama)}</h2><p class="muted" style="margin:8px 0 20px">${esc(u.email)}</p>
 <div class="detail-grid"><div><small>Status</small><strong>${u.deleted_at?'Dalam sampah':u.diblokir?'Diblokir':'Aktif'}</strong></div><div><small>Saldo</small><strong>${rp(u.saldo)}</strong></div><div><small>Tier</small><strong>${esc(u.tier)}</strong></div><div><small>Terdaftar</small><strong>${esc((u.created_at||'').slice(0,10))}</strong></div></div>
 ${u.owner_protected?'<div class="info-note">Akun pemilik dilindungi dari pemblokiran dan penghapusan.</div>':u.deleted_at?`<div class="info-note">Riwayat belum dihapus permanen. Pemulihan tidak mengembalikan token login lama.</div><div class="form-actions static"><button class="btn" onclick="restoreUser('${id}')">Pulihkan akun</button><button class="btn danger" onclick="permanentUser('${id}')">Hapus permanen</button></div>`:
 `<div class="form-actions static"><button class="btn ghost" onclick="formLencana('${id}',DATA.users.find(u=>u.id==='${id}').badge,DATA.users.find(u=>u.id==='${id}').tier)">Lencana & Tier</button><button class="btn ghost" onclick="ubahSaldo('${id}',${u.saldo})">Kelola saldo</button><button class="btn ${u.diblokir?'':'danger'}" onclick="blokirAkun('${id}',${u.diblokir?0:1})">${u.diblokir?'Buka blokir':'Blokir akun'}</button></div><div class="danger-zone"><h3>Pindahkan ke Sampah</h3><p>Menonaktifkan akun tanpa menghapus datanya. Saldo dan transaksi aktif harus diselesaikan dahulu.</p><button class="btn danger" onclick="trashUser('${id}')">Hapus ke Sampah</button></div>`}
 <div class="form-actions"><button class="btn ghost" onclick="tutupModal()">Tutup</button></div>`);
}
async function trashUser(id){if(!await xkonfirmasi('Pindahkan akun ke Sampah?','Akun tidak bisa masuk sampai dipulihkan. Ini bukan penghapusan permanen.',{tombol:'Pindahkan',bahaya:true}))return;await api('/users/'+id+'/trash',{method:'POST',body:JSON.stringify({konfirmasi:'HAPUS'})});tutupModal();toast('Akun dipindahkan ke Sampah');await vUsers();}
async function restoreUser(id){await api('/users/'+id+'/restore',{method:'POST',body:'{}'});tutupModal();toast('Akun dipulihkan');await vSampah();}
async function permanentUser(id){const u=DATA.users.find(u=>u.id===id);const email=await xtanya('Hapus permanen','Ketik email akun untuk memastikan target','');if(email===null)return;const yes=await xkonfirmasi('Tindakan ini tidak dapat dibatalkan',`Hapus permanen akun ${esc(u.email)}?`,{tombol:'Hapus permanen',bahaya:true});if(!yes)return;await api('/users/'+id+'/permanent',{method:'DELETE',body:JSON.stringify({email,konfirmasi:'HAPUS PERMANEN'})});tutupModal();toast('Penghapusan permanen selesai');await vSampah();}

async function vSecurity(){
 const d=await api('/security'),p=d.config;DATA.security=d;
 document.getElementById('main').innerHTML=head('Keamanan','Aturan server, anggaran email, dan peninjauan penyalahgunaan')+
 `<div class="grid g4 security-stats">${[[d.stats.devices,'Perangkat dikenali'],[d.stats.blocked,'Perangkat diblokir'],[d.stats.events,'Kejadian 24 jam'],[d.stats.emails+' / '+p.email_daily,'Email hari ini']].map(([n,l])=>`<div class="card stat"><span>${l}</span><b>${n}</b></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:20px"><section class="card"><h2>Aturan pendaftaran & OTP</h2><p class="muted">Diterapkan di server dan diperiksa ulang secara atomik saat akun dibuat.</p>
 ${[['device_accounts','Pendaftaran per perangkat',20],['register_ip_hour','Pendaftaran per IP / jam',100],['otp_email_hour','OTP per email / jam',10],['otp_email_day','OTP per email / hari',30],['email_daily','Maksimum email / hari',d.email_max]].map(([k,l,max])=>`<div class="field"><label for="sec_${k}">${l}</label><input id="sec_${k}" type="number" min="1" max="${max}" value="${p[k]}"></div>`).join('')}
 <div class="form-actions static"><button class="btn" id="sec_save" onclick="saveSecurity()">Simpan aturan</button></div></section>
 <section class="card"><h2>Bagaimana perangkat dikenali?</h2><p class="body-note">Android memakai identitas yang dipseudonimkan, bukan IMEI. Browser memakai identitas penyimpanan lokal. Identifier dari client bukan bukti hardware: reset, profil baru, root, atau client modifikasi dapat mengubahnya.</p><div class="info-note">Batas perangkat dilapis dengan IP, OTP per email, dan anggaran email global. Akun lama tidak diberi identitas perangkat hasil tebakan.</div><p class="body-note">Menghapus akun tidak otomatis mengembalikan jatah pendaftaran. Pemilik dapat mereset kuota setelah peninjauan pada menu Perangkat.</p><p class="body-note">OTP baru disimpan sebagai digest, state OAuth hanya sekali pakai, dan blokir/penghapusan mencabut sesi akun.</p><button class="btn ghost" onclick="ke('perangkat')">Tinjau perangkat</button></section></div>`;
}
async function saveSecurity(){const b=document.getElementById('sec_save');b.disabled=true;try{const config={};for(const k of Object.keys(DATA.security.config))config[k]=Number(document.getElementById('sec_'+k).value);await api('/security',{method:'POST',body:JSON.stringify(config)});toast('Aturan keamanan tersimpan');await vSecurity();}finally{b.disabled=false;}}
async function vDevices(){const [list,sec]=await Promise.all([api('/devices'),api('/security')]);DATA.devices=list;
 document.getElementById('main').innerHTML=head('Perangkat','Identitas pseudonim untuk pembatasan pendaftaran; bukan pelacakan IMEI')+
 `<div class="card table-scroll"><table><thead><tr><th>Perangkat</th><th>Pendaftaran</th><th>Akun terkait</th><th>Status</th><th>Terakhir</th><th></th></tr></thead><tbody>${list.map(d=>`<tr><td><b>${esc(d.model||d.kind)}</b><small class="mono">${d.id.slice(0,14)}…</small></td><td>${d.registrations} / ${d.max_accounts||sec.config.device_accounts}</td><td>${d.linked_accounts}</td><td><span class="status-pill ${d.blocked?'bad':'good'}">${d.blocked?'Diblokir':'Dikenali'}</span></td><td>${dt(d.last_seen)}</td><td><button class="btn sm ghost" onclick="deviceDetails('${d.id}')">Kelola</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Perangkat akan tercatat setelah aplikasi/browser terbaru dipakai untuk masuk atau mendaftar.</td></tr>'}</tbody></table></div>`;
}
async function deviceDetails(id){const d=DATA.devices.find(d=>d.id===id),users=await api('/devices/'+id);modal(`<div class="dialog-eyebrow">IDENTITAS PERANGKAT</div><h2>${esc(d.model||d.kind)}</h2><p class="mono body-note">${id}</p><div class="info-note">Registrasi tercatat: ${d.registrations}. Reset kuota tidak menghapus akun yang sudah ada.</div><div class="list-lines">${users.map(u=>`<div><strong>${esc(u.nama)}</strong><small>${esc(u.email)} · ${u.signup?'Pendaftaran':'Login'}${u.deleted_at?' · Sampah':''}</small></div>`).join('')||'<p>Belum ada akun aktif terkait.</p>'}</div><div class="form-actions static"><button class="btn ${d.blocked?'':'danger'}" onclick="deviceBlock('${id}',${d.blocked?0:1})">${d.blocked?'Buka blokir':'Blokir perangkat'}</button><button class="btn ghost" onclick="deviceReset('${id}')">Reset jatah pendaftaran</button></div><div class="form-actions"><button class="btn ghost" onclick="tutupModal()">Tutup</button></div>`);}
async function deviceBlock(id,blocked){if(!await xkonfirmasi(blocked?'Blokir perangkat?':'Buka blokir?','Sesi baru dari identitas perangkat ini akan mengikuti status yang dipilih.',{tombol:'Terapkan',bahaya:!!blocked}))return;await api('/devices/'+id+'/block',{method:'POST',body:JSON.stringify({blocked:!!blocked,reason:'Ditinjau oleh pemilik'})});tutupModal();await vDevices();}
async function deviceReset(id){if(!await xkonfirmasi('Reset jatah pendaftaran?','Akun yang sudah dibuat tetap ada. Tindakan ini dicatat pada audit keamanan.',{tombol:'Reset',bahaya:true}))return;await api('/devices/'+id+'/reset',{method:'POST',body:JSON.stringify({konfirmasi:'RESET'})});tutupModal();await vDevices();}
async function vAudit(){const [admin,security]=await Promise.all([api('/audit'),api('/security/events')]);document.getElementById('main').innerHTML=head('Audit & Kejadian','Riwayat tindakan admin dan penolakan keamanan—tanpa password atau kode OTP')+`<div class="grid g2"><section class="card"><h2>Tindakan admin</h2><div class="list-lines">${admin.map(x=>`<div><strong>${esc(x.aksi)}</strong><small>${esc(x.admin)} · ${dt(x.waktu)} · ${esc(x.target||'')}</small></div>`).join('')||'<p class="muted">Belum ada catatan.</p>'}</div></section><section class="card"><h2>Kejadian keamanan</h2><div class="list-lines">${security.map(x=>`<div><strong>${esc(x.kind)} <span class="status-pill muted">${x.count}×</span></strong><small>${esc(x.note||'')} · ${dt(x.last_seen)}</small><small class="mono">${esc((x.subject||'').slice(0,14))}</small></div>`).join('')||'<p class="muted">Belum ada kejadian tercatat.</p>'}</div></section></div>`;}
async function vMedia(){const list=await api('/media');DATA.media=list;document.getElementById('main').innerHTML=head('Pusat Media','Sajian adaptif, cache gambar dan inventaris unggahan')+`<div class="info-note">Gambar statis disajikan sebagai WebP/AVIF dengan ukuran sesuai konteks. Animasi dipertahankan. Angka ukuran sumber bukan ukuran unduhan versi optimasi.</div><div class="grid media-grid">${list.map((m,i)=>`<article class="card media-card"><div class="media-preview"><img loading="lazy" decoding="async" src="${esc(mediaUrl(m.preview))}" alt=""></div><div><strong>${esc(m.folder)}</strong><p class="muted">${esc(m.format||'gambar')} · ${m.width||'?'} × ${m.height||'?'} · ${m.bytes?Math.round(m.bytes/1024)+' KB sumber':'ukuran belum tersedia'}</p><button class="btn sm ghost" onclick="measureMedia(${i},this)">Uji versi optimasi</button><small id="media_result_${i}"></small></div></article>`).join('')||'<div class="card empty">Unggahan baru akan tercatat di sini. Gambar lama tetap memakai jalur sajian teroptimasi.</div>'}</div>`;}
async function measureMedia(i,button){button.disabled=true;try{const start=performance.now(),r=await fetch(DATA.media[i].preview);if(!r.ok)throw new Error('Gambar belum tersedia');const b=await r.blob();document.getElementById('media_result_'+i).textContent=`${(b.size/1024).toFixed(1)} KB · ${b.type} · ${Math.round(performance.now()-start)} ms`;}catch(e){document.getElementById('media_result_'+i).textContent=e.message;}finally{button.disabled=false;}}

/* ---------- start ---------- */
if(KEY){document.getElementById('gk').value=KEY;masuk()}
</script>
</body>
</html>
