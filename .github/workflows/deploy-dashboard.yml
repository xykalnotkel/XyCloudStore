name: Deploy Dashboard Next.js

# Build/deploy produksi hanya boleh dipicu manual setelah verifikasi pemilik.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Ketik DEPLOY DASHBOARD untuk mengizinkan build/deploy produksi"
        required: true
        type: string

concurrency:
  group: deploy-dash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirmation == 'DEPLOY DASHBOARD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        working-directory: dashboard
        run: npm ci

      - name: Build Next.js static export
        working-directory: dashboard
        env:
          NEXT_PUBLIC_API_BASE: https://api.xycloud.my.id
        run: npm run build

      - name: Upload out artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-out
          path: dashboard/out
          retention-days: 14

  # Set repo variable ENABLE_CF_PAGES=true + secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
  deploy-cloudflare:
    name: Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.ENABLE_CF_PAGES == 'true' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-out
          path: dashboard/out
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # packageManager npm + npx yes menghindari gagal "npx canceled due to missing packages"
          packageManager: npm
          command: pages deploy dashboard/out --project-name=xycloud-dashboard --commit-dirty=true

  # Set repo variable ENABLE_VERCEL=true + secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # Catatan: rootDirectory project Vercel = "dashboard", jadi CLI harus dijalankan
  # dari root monorepo (bukan working-directory: dashboard) supaya path tidak jadi dashboard/dashboard.
  deploy-vercel:
    name: Vercel production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.ENABLE_VERCEL == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Deploy from monorepo root
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@54.17.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@54.17.3 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@54.17.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
