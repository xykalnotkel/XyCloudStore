name: APK Uji Internal (bukan rilis)

# Menghasilkan APK yang BISA DIUNDUH untuk dicoba di perangkat nyata, tanpa
# menyentuh jalur rilis sama sekali:
#   - DEFAULT TANPA keystore: buildTypes.release template Flutter memakai
#     signingConfigs.debug, jadi APK ditandatangani kunci debug.
#   - OPSI signed_resmi=true: menandatangani dengan keystore resmi repo ini
#     (secrets KEYSTORE_BASE64/KEY_ALIAS/KEY_PASSWORD/STORE_PASSWORD) supaya
#     APK bisa dipasang menimpa instalasi rilis resmi di perangkat tanpa
#     uninstall dulu. Ini HANYA mengganti tanda tangan pada build uji:
#     tetap TIDAK membuat GitHub Release, TIDAK meregistrasi versi ke server,
#     TIDAK mengunggah ke /unduh, TIDAK memicu popup pembaruan.
#   - Hanya artifact Actions (retensi 7 hari) yang butuh login repo untuk diunduh.
#
# Rilis publik tetap lewat repo `XyCloudStore-build` dengan keystore pemilik.
on:
  workflow_dispatch:
    inputs:
      mock:
        description: "Mode demo tanpa server (XY_MOCK)?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      base_url:
        description: "Base URL API yang dipakai APK"
        required: false
        default: "https://api.xycloud.my.id"
        type: string
      split_abi:
        description: "Bangun juga APK per-ABI (lebih kecil, lebih lama)?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      signed_resmi:
        description: "Tandatangai dengan keystore RESMI repo ini? (bukan debug; tetap bukan rilis)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: apk-uji-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  APP_DIR: app

jobs:
  build:
    name: Bangun APK uji (signed_resmi=${{ github.event.inputs.signed_resmi }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create . \
            --platforms=android \
            --org id.xycloud \
            --project-name xycloud_order \
            --description "XyCloudStore - Sewa PC Cloud, Beli Akun, CS Realtime"

      - name: Siapkan engine streaming native dalam APK
        run: python3 tools/siapkan_streaming.py

      - name: Siapkan updater native
        working-directory: ${{ env.APP_DIR }}
        run: python3 ../tools/siapkan_pembaruan.py android

      - name: Siapkan mode privasi (FLAG_SECURE)
        working-directory: ${{ env.APP_DIR }}
        run: python3 ../tools/siapkan_keamanan.py android

      - name: Siapkan login biometrik
        working-directory: ${{ env.APP_DIR }}
        run: python3 ../tools/siapkan_biometrik.py android

      - name: Siapkan ikon push
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --user --quiet pillow
          python3 ../tools/siapkan_ikon_push.py --android-dir android

      - name: Naikkan versi Kotlin & minSdk
        working-directory: ${{ env.APP_DIR }}
        run: |
          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/(org\.jetbrains\.kotlin\.android["\)]?[[:space:]]+version[[:space:]]+")[^"]+"/\12.2.20"/' "$f"
          done
          for f in android/build.gradle android/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/(kotlin-gradle-plugin:)[0-9.]+/\12.2.20/' "$f" || true
          done
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/(minSdk\s*=?\s*)flutter\.minSdkVersion/\123/' "$f"
          done

      - name: Bersihkan berkas bawaan flutter create
        working-directory: ${{ env.APP_DIR }}
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Generate launcher icon & splash
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Set nama aplikasi & izin internet
        working-directory: ${{ env.APP_DIR }}
        run: python3 ../tools/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Siapkan tanda tangan resmi (opsional, hanya signing)
        if: github.event.inputs.signed_resmi == 'true'
        working-directory: ${{ env.APP_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?secret KEYSTORE_BASE64 belum diisi}"
          : "${KEY_ALIAS:?secret KEY_ALIAS belum diisi}"
          : "${KEY_PASSWORD:?secret KEY_PASSWORD belum diisi}"
          : "${STORE_PASSWORD:?secret STORE_PASSWORD belum diisi}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          python3 ../tools/patch_signing.py android/app
          {
            echo "storeFile=$(pwd)/android/release.keystore"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > android/key.properties
          echo "key.properties ditulis. Signing release aktif HANYA untuk run ini;"
          echo "berkas ini tidak di-commit dan tidak dipakai jalur lain."

      - name: Analyze & test (gerbang sebelum APK dibuat)
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build APK universal (uji)
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build apk --release \
            --dart-define="XY_MOCK=${{ github.event.inputs.mock }}" \
            --dart-define="XY_BASE_URL=${{ github.event.inputs.base_url }}" \
            --dart-define=XY_ONESIGNAL_APP_ID=f4843c35-cc1d-4772-9f70-1c4349397ffb \
            --dart-define=XY_GOOGLE_SERVER_CLIENT_ID=495336144977-1fu3nv7r35pi2i0t8qu6ng0u695t0veg.apps.googleusercontent.com

      - name: Build APK per-ABI (opsional)
        if: github.event.inputs.split_abi == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define="XY_MOCK=${{ github.event.inputs.mock }}" \
            --dart-define="XY_BASE_URL=${{ github.event.inputs.base_url }}" \
            --dart-define=XY_ONESIGNAL_APP_ID=f4843c35-cc1d-4772-9f70-1c4349397ffb \
            --dart-define=XY_GOOGLE_SERVER_CLIENT_ID=495336144977-1fu3nv7r35pi2i0t8qu6ng0u695t0veg.apps.googleusercontent.com

      - name: Kumpulkan, beri nama jelas, dan hitung checksum
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          SHA_PENDEK=$(git rev-parse --short HEAD)
          VERSI=$(grep -oE '^version: [^+]+' pubspec.yaml | awk '{print $2}')
          if [ "${{ github.event.inputs.signed_resmi }}" = "true" ]; then SUFFIX="-resmi"; else SUFFIX=""; fi
          mkdir -p ../dist-uji
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../dist-uji/XyCloudStore-UJI-${VERSI}-${SHA_PENDEK}${SUFFIX}-universal.apk"
          if [ "${{ github.event.inputs.split_abi }}" = "true" ]; then
            for abi in arm64-v8a armeabi-v7a x86_64; do
              f="build/app/outputs/flutter-apk/app-$abi-release.apk"
              [ -f "$f" ] && cp "$f" "../dist-uji/XyCloudStore-UJI-${VERSI}-${SHA_PENDEK}${SUFFIX}-$abi.apk"
            done
          fi
          if [ "${{ github.event.inputs.signed_resmi }}" = "true" ]; then
            cat > ../dist-uji/README-PENTING.txt <<'TXT'
          APK UJI INTERNAL — TANDA TANGAN RESMI, TETAP BUKAN RILIS
          ========================================================

          Ditandatangani dengan keystore RESMI XyCloudStore (secrets repo
          ini), sehingga BISA dipasang menimpa instalasi rilis resmi di
          perangkat tanpa uninstall dulu.

          Tetapi ini TETAP build uji, bukan rilis:
          1. Tidak dibuatkan GitHub Release, tidak diregistrasi ke server,
             tidak muncul di halaman /unduh, tidak memicu popup pembaruan.
          2. JANGAN dibagikan ke pengguna akhir.
          3. Jika perangkat masih memakai APK uji bertanda tangan DEBUG,
             uninstall dulu sekali (tanda tangan debug != resmi).

          Rilis publik tetap dibangun di repo XyCloudStore-build.
          TXT
          else
            cat > ../dist-uji/README-PENTING.txt <<'TXT'
          APK UJI INTERNAL — BUKAN RILIS
          ==============================

          Ditandatangani dengan KUNCI DEBUG, bukan keystore rilis XyCloudStore.

          Konsekuensinya:
          1. TIDAK BISA dipasang menimpa aplikasi XyCloudStore yang sudah
             terpasang dari rilis resmi (tanda tangan berbeda ->
             INSTALL_FAILED_UPDATE_INCOMPATIBLE). Uninstall dulu, data lokal
             aplikasi akan hilang; saldo & riwayat tetap aman di server.
          2. JANGAN dibagikan ke pengguna. Ini hanya untuk uji fungsi.
          3. Tidak terdaftar di server, tidak muncul di halaman /unduh, dan
             tidak akan memicu popup pembaruan.

          Rilis resmi tetap dibangun di repo XyCloudStore-build dengan
          keystore pemilik, setelah izin eksplisit.
          TXT
          fi
          (cd ../dist-uji && sha256sum ./*.apk ./README-PENTING.txt > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh ../dist-uji

      - name: Unggah artifact uji
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XyCloudStore-APK-UJI-${{ github.event.inputs.signed_resmi == 'true' && 'SIGNED-RESMI' || 'DEBUG' }}
          path: |
            dist-uji/*.apk
            dist-uji/README-PENTING.txt
            dist-uji/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

      - name: Ringkasan unduhan
        run: |
          {
            echo "## APK uji internal siap diunduh"
            echo ""
            if [ "${{ github.event.inputs.signed_resmi }}" = "true" ]; then
              echo "**Tanda tangan RESMI (keystore repo) — tetap BUKAN rilis.** Baca \`README-PENTING.txt\`."
            else
              echo "**Tanda tangan debug — bukan rilis.** Baca \`README-PENTING.txt\` di dalam artifact."
            fi
            echo ""
            echo "| Berkas | Ukuran |"
            echo "|---|---|"
            for f in dist-uji/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Unduh di bagian **Artifacts** halaman run ini (perlu login GitHub)."
            echo ""
            echo "- Mode demo (XY_MOCK): \`${{ github.event.inputs.mock }}\`"
            echo "- Base URL API: \`${{ github.event.inputs.base_url }}\`"
            echo "- Tanda tangan resmi: \`${{ github.event.inputs.signed_resmi }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "Checksum SHA-256:"
            echo '```'
            cat dist-uji/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
