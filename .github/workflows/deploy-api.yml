name: Deploy API Worker + D1

# Produksi hanya boleh berubah lewat tombol manual setelah seluruh verifikasi lokal lulus.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Ketik DEPLOY API untuk mengizinkan migrasi D1 dan deploy Worker"
        required: true
        type: string

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verifikasi, migrasi, deploy, smoke test
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirmation == 'DEPLOY API'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout source terverifikasi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependency terkunci
        run: npm ci --no-audit --no-fund

      - name: Pemeriksaan sintaks Worker
        run: |
          set -euo pipefail
          for file in src/*.js test/*.mjs; do node --check "$file" >/dev/null; done

      - name: Uji regresi API lengkap
        run: npm test

      - name: Validasi credential wajib
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN belum dipasang"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID belum dipasang"; exit 1; }
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY khusus XyCloudStore belum dipasang"; exit 1; }

      - name: Catat bookmark pemulihan D1
        run: npx wrangler d1 time-travel info xycloud --remote || true

      - name: Terapkan migrasi D1 yang belum berjalan
        run: npx wrangler d1 migrations apply xycloud --remote

      - name: Pasang secret Groq tanpa mencetak nilainya
        run: printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy

      - name: Smoke test produksi
        working-directory: .
        run: |
          set -euo pipefail
          # PENTING: endpoint kesehatan publik adalah `/health`, BUKAN
          # `/api/health`. Di api/src/index.js route-nya `path === '/health'`
          # (baris ~1829) dan hanya itu yang masuk allowlist tanpa autentikasi
          # (baris ~2139). `/api/health` jatuh ke gerbang auth dan membalas
          # HTTP 401, sehingga `curl --fail` di sini membuat seluruh deploy
          # terlihat gagal padahal Worker dan migrasi sudah sukses.
          # Diverifikasi 2026-09-18: /health -> 200 {"data":{"ok":true,...}},
          #                              /api/health -> 401 {"error":"Unauthorized"}.
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            https://api.xycloud.my.id/health >/tmp/health.json
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            https://api.xycloud.my.id/api/config >/tmp/config.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('/tmp/config.json', 'utf8'));
          // /health  -> {"data":{"ok":true,"at":"..."}}
          if (health?.data?.ok !== true) throw new Error('Smoke test gagal: /health tidak ok=true');
          // /api/config -> {"data":{...}} ; pastikan pemeliharaan tidak aktif tak terduga
          if (!config?.data || typeof config.data !== 'object') {
            throw new Error('Smoke test gagal: /api/config tidak memuat data');
          }
          const pemeliharaan = config.data.pemeliharaan?.aktif;
          console.log(`Health OK pada ${health.data.at}`);
          console.log(`Config OK; pemeliharaan aktif = ${pemeliharaan}`);
          console.log(`Provider login: google=${config.data.providers?.google} facebook=${config.data.providers?.facebook}`);
          NODE

      - name: Ringkasan aman
        working-directory: .
        run: |
          {
            echo "## API production deployed"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- D1 migrations: applied"
            echo "- Worker: deployed"
            echo "- Groq secret: installed (value never printed)"
            echo "- AI enforcement: tetap mengikuti mode D1 dan guard ZDR"
          } >> "$GITHUB_STEP_SUMMARY"
